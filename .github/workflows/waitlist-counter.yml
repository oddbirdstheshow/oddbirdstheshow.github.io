# Keeps the "birds still at large" counter on the home page up to date.
# Every 30 minutes it asks Kit how many people have confirmed their waitlist
# sign-up, and writes that number to count.json on the `data` branch, which the
# page reads. The Kit key lives only in the KIT_API_KEY repository secret.
name: Update waitlist counter

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waitlist-counter
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count confirmed waitlist sign-ups and update count.json
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_FORM_ID: "10149386"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${KIT_API_KEY}" ]; then
            echo "::warning::The KIT_API_KEY secret isn't set yet, so the counter can't update."
            exit 0
          fi

          # Confirmed ("active") subscribers on the waitlist form. Only the total is used.
          resp=$(curl -fsS \
            -H "X-Kit-Api-Key: ${KIT_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.kit.com/v4/forms/${KIT_FORM_ID}/subscribers?status=active&include_total_count=true&per_page=1")
          total=$(printf '%s' "$resp" | jq -r '.pagination.total_count // empty')
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "::error::Kit didn't return a total count. Check the KIT_API_KEY secret and the form ID."
            exit 1
          fi
          echo "Confirmed waitlist sign-ups: $total"

          current=$(gh api "repos/${GITHUB_REPOSITORY}/contents/count.json?ref=data" 2>/dev/null || echo '{}')
          sha=$(printf '%s' "$current" | jq -r '.sha // empty')
          old=$( (printf '%s' "$current" | jq -r '.content // empty' | base64 -d | jq -r '.spotted // empty') 2>/dev/null || true)
          if [ "$old" = "$total" ]; then
            echo "No change since last time."
            exit 0
          fi

          body=$(jq -cn --argjson n "$total" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{spotted:$n, updated:$t}')
          args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/count.json"
                -f message="Waitlist counter: ${total} spotted"
                -f branch=data
                -f content="$(printf '%s\n' "$body" | base64 -w0)")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          gh api "${args[@]}" --jq '.commit.sha' >/dev/null
          echo "count.json updated to ${total}."
