<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oddbirds: get the word first</title>
<meta name="description" content="10,006 birds just flew the coop. Join the waitlist.">
<meta property="og:title" content="Oddbirds: get the word first">
<meta property="og:description" content="10,006 birds just flew the coop. Join the waitlist.">
<meta property="og:image" content="https://oddbirdstheshow.github.io/img/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FEF104">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FEF104;   /* matches the felt logo's backdrop */
  --ink:#141414;
  --teal:#1D6B61;
  --mute:#4a4630;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --hand:"Caveat Brush","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--yellow);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
a{color:inherit}
em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}

/* One screen: a narrow signup column on the left, the landscape film filling the rest.
   The column has a capped width, so a wider browser shows more of the film. */
.screen{height:100vh;height:100svh;display:grid;grid-template-columns:clamp(340px,30vw,440px) minmax(0,1fr)}
@media (min-height:540px){body{overflow:hidden}}

.panel{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vh,48px) clamp(24px,2.8vw,44px)}
.inner{width:100%;margin:auto 0}
.logo{width:100%;height:auto;margin-left:-3%}
.soon{font-family:var(--hand);font-size:clamp(22px,3.2vh,30px);transform:rotate(-4deg);transform-origin:left;margin:-2px 0 clamp(18px,4vh,40px) 14%;line-height:1}
h1{font-size:clamp(32px,min(5.6vh,3.6vw),52px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:0}
.sub{font-size:clamp(15px,1.9vh,17px);margin:clamp(12px,2.2vh,20px) 0 clamp(20px,3.6vh,32px);max-width:30em;color:#2b2918}

form{position:relative}
.field{display:flex;gap:8px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 18px 40px -22px rgba(60,50,0,.45)}
.field input[type=email]{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 12px;border:0;background:transparent;color:var(--ink)}
.field input[type=email]:focus{outline:none}
.field:focus-within{box-shadow:0 0 0 2px var(--ink),0 18px 40px -22px rgba(60,50,0,.45)}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:12px 20px;background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap;transition:background .12s ease}
button:hover{background:#000}
button:disabled{opacity:.6;cursor:wait}
.fine{font-size:13px;color:var(--mute);margin:10px 0 0}
.msg{display:none;margin-top:12px;font-size:15px;font-weight:500}
.msg.ok{display:block;color:var(--teal)}
.msg.err{display:block;color:#a33a10}
.done .field,.done .fine{display:none}
.done .msg.ok{font-size:clamp(18px,2.4vh,22px);margin-top:0;background:#fff;border-radius:14px;padding:16px 18px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin-top:clamp(16px,3vh,28px)}
.links a{text-decoration:none;border-bottom:1px solid rgba(20,20,20,.25)}
.links a:hover{border-color:var(--ink)}

.film{position:relative;background:#2c3328;overflow:hidden}
.film video{width:100%;height:100%;object-fit:cover}
.film .watch{position:absolute;right:16px;bottom:16px;background:rgba(255,255,255,.92);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px}

/* Phones and narrow screens: film on top, panel below, still one screen */
@media (max-width:820px){
  .screen{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .film{order:-1}
  .panel{padding:18px 20px calc(16px + env(safe-area-inset-bottom))}
  .inner{margin:0;max-width:460px}
  .logo{width:min(250px,68%)}
  .soon{font-size:22px;margin:-4px 0 12px 12%}
  h1{font-size:clamp(30px,8.6vw,40px)}
  .sub{font-size:15px;margin:8px 0 14px}
  .field input[type=email]{font-size:16px;padding:10px}
  button{padding:10px 16px;font-size:15px}
  .fine{display:none}
  .links{margin-top:12px;font-size:12px}
  .film .watch{right:12px;bottom:12px;font-size:12px;padding:6px 12px}
}
@media (max-width:820px) and (max-height:700px){
  .soon{display:none}
  .logo{margin-bottom:10px}
  .sub{display:none}
  h1{margin-bottom:12px}
}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="screen">
  <section class="panel">
    <div class="inner">
      <img class="logo" src="img/logo-felt.jpg" alt="Oddbirds" width="1400" height="422">
      <p class="soon" aria-hidden="true">Coming soon</p>

      <h1>Get the word <em>before anyone else.</em></h1>
      <p class="sub">10,006 birds just flew the coop. Join the waitlist and be first to know where they land.</p>

      <form class="waitlist" novalidate>
        <label class="hp" aria-hidden="true">Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
        <div class="field">
          <input type="email" name="email_address" placeholder="you@email.com" autocomplete="email" required aria-label="Email address">
          <button type="submit">Hollerrr!</button>
        </div>
        <p class="fine">Free. No spam. Unsubscribe any time.</p>
        <div class="msg" role="status" aria-live="polite"></div>
      </form>

      <nav class="links" aria-label="More">
        <a href="https://www.tiktok.com/@oddbirds_theshow">TikTok</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="terms.html" title="Oddbirds Studio is our internal tool for sending our own films to our own TikTok drafts. It isn't offered to other users.">About Oddbirds Studio</a>
        <a href="https://opensea.io/oddbirds">OpenSea</a>
      </nav>
    </div>
  </section>

  <section class="film" aria-label="Cuckoo Clock Bird, the first Oddbirds film">
    <video poster="img/cuckoo-clock-poster-1080.jpg" autoplay muted loop playsinline preload="auto" aria-label="A felt bird in goggles bursts out of a cuckoo clock and lands on a yarn tree">
      <source src="img/cuckoo-clock-tall.mp4" type="video/mp4" media="(max-width: 820px)">
      <source src="img/cuckoo-clock-1080.mp4" type="video/mp4">
    </video>
    <a class="watch" href="https://www.tiktok.com/@oddbirds_theshow">Watch on TikTok →</a>
  </section>
</main>

<script>
// Phones play the tall cut, so give them the tall poster too.
if (matchMedia("(max-width: 820px)").matches) document.querySelector(".film video").poster = "img/cuckoo-clock-tall-poster.jpg";

/*
  Waitlist hookup: the Oddbirds Kit account (separate from Blacksmith).
  KIT_FORM_ID is the number in the Kit form's URL (app.kit.com/forms/<number>/...).
  It's public by design; the Kit API key is not and never goes here.
*/
const KIT_FORM_ID = "10149386";
const WAITLIST_ENDPOINT = KIT_FORM_ID ? `https://app.kit.com/forms/${KIT_FORM_ID}/subscriptions` : "";

document.querySelectorAll("form.waitlist").forEach(form => {
  const msg = form.querySelector(".msg");
  const btn = form.querySelector("button");
  const label = btn.textContent;
  const show = (text, ok) => { msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "err"); };

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (form.website.value) return;                       // bot trap
    const email = form.email_address.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { show("That email doesn't look quite right.", false); form.email_address.focus(); return; }
    if (!WAITLIST_ENDPOINT) { show("The waitlist opens very soon. Check back in a day or two!", false); return; }

    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const res = await fetch(WAITLIST_ENDPOINT, { method: "POST", body: new URLSearchParams({ email_address: email }), headers: { "Accept": "application/json" } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || (data.status && data.status !== "success")) throw new Error(res.status);
      form.classList.add("done");
      show("You're nearly on the list. Check your inbox and confirm, and we'll save you a bird.", true);
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      show("Something went wrong on our end. Please try again in a minute.", false);
    }
  });
});
</script>
</body>
</html>
